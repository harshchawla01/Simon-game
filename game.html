<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simon Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Simon Game</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="game.html">Play Game</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="row">
        <div class="col-lg-8 container text-center">
            <h2 class="my-4">Simon Game</h2>
            
            <div class="row mb-4">
                <div class="col-md-6 offset-md-3">
                    <div class="input-group">
                        <span class="input-group-text">Player Name</span>
                        <input type="text" class="form-control" id="playerName" placeholder="Enter your name">
                    </div>
                </div>
            </div>

            <div class="game-settings mb-4">
                <div class="row justify-content-center">
                    <div class="col-md-4 mb-3">
                        <div class="form-check form-switch d-flex justify-content-center">
                            <input class="form-check-input" type="checkbox" id="soundToggle" checked>
                            <label class="form-check-label mx-2" for="soundToggle">Sound</label>
                        </div>
                    </div>
                    <div class="col-md-8 mb-3">
                        <select class="form-select" id="difficultySelect">
                            <option value="easy">Easy - Visual and sound</option>
                            <option value="medium">Medium - Fast visual and sound</option>
                            <option value="hard">Hard - Sound only (Musicians have an edge)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="simon-container mb-4">
                <div id="centerLevel" style="position: absolute; top: 68%; left: 50%; transform: translate(-50%, -50%); background-color: black; color: white; width: 100px; height: 100px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 10; font-weight: bold;">0</div>
                <div class="simon-row">
                    <div class="simon-btn green" id="green"></div>
                    <div class="simon-btn red" id="red"></div>
                </div>
                <div class="simon-row">
                    <div class="simon-btn yellow" id="yellow"></div>
                    <div class="simon-btn blue" id="blue"></div>
                </div>
            </div>

            <div id="gameStats" class="mb-4 d-none">
            <!-- <div id="gameStats" class="mb-4"></div> -->
                <div class="alert alert-info">
                    <h5>Current Score: <span id="currentScore">0</span></h5>
                    <p>Level: <span id="level">0</span></p>
                </div>
            </div>

            <div id="gameOverDisplay" class="alert alert-danger mb-4 d-none">
                <h5>Game Over!</h5>
                <p>Your score: <span id="finalScore">0</span></p>
                <p>Difficulty: <span id="finalDifficulty">Easy</span></p>
                <button type="button" class="btn btn-primary" id="saveScoreBtn">Save Score</button>
                <button type="button" class="btn btn-secondary" id="dontSaveBtn">Don't Save</button>
            </div>

            <div class="game-controls mb-3">
                <button id="startBtn" class="btn btn-primary">Start Game</button>
                <button id="stopBtn" class="btn btn-danger" disabled>Stop</button>
                <button id="restartBtn" class="btn btn-warning" disabled>Restart</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/game.js"></script>
</body>
</html>
